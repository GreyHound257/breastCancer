<!DOCTYPE html>
<html>
<head>
    <title>Wine Cultivar Predictor</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; text-align: center; padding: 50px; }
        .container { background: white; max-width: 500px; margin: auto; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { background-color: #722f37; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; }
        button:hover { background-color: #5a232b; }
        .result { margin-top: 20px; font-size: 20px; font-weight: bold; color: #722f37; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍷 Wine Origin Predictor</h1>
        <form action="/predict" method="post">
            <input type="number" step="0.01" name="alcohol" placeholder="Alcohol (e.g. 13.5)" required>
            <input type="number" step="0.01" name="malic_acid" placeholder="Malic Acid (e.g. 2.0)" required>
            <input type="number" step="0.01" name="ash" placeholder="Ash (e.g. 2.5)" required>
            <input type="number" step="1" name="magnesium" placeholder="Magnesium (e.g. 100)" required>
            <input type="number" step="0.01" name="flavanoids" placeholder="Flavanoids (e.g. 2.5)" required>
            <input type="number" step="0.01" name="color_intensity" placeholder="Color Intensity (e.g. 5.0)" required>
            <button type="submit">Predict Cultivar</button>
        </form>
        <div class="result">{{ prediction_text }}</div>
    </div>
</body>
</html>
