<!DOCTYPE html>
<html>
<head>
    <title>Breast Cancer Predictor</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #ffe6f2; text-align: center; padding: 40px; }
        .container { background: white; max-width: 450px; margin: auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #d63384; }
        input { width: 90%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; }
        button { background-color: #d63384; color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #a61e63; }
        .result-box { margin-top: 25px; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 22px; display: none; }
        .safe { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; display: block; }
        .danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎗️ Breast Cancer AI</h1>
        <p>Enter tumor metrics below:</p>
        <form action="/predict" method="post">
            <input type="number" step="0.01" name="radius" placeholder="Mean Radius (e.g., 14.0)" required>
            <input type="number" step="0.01" name="texture" placeholder="Mean Texture (e.g., 20.0)" required>
            <input type="number" step="0.01" name="perimeter" placeholder="Mean Perimeter (e.g., 90.0)" required>
            <input type="number" step="0.01" name="area" placeholder="Mean Area (e.g., 600.0)" required>
            <input type="number" step="0.0001" name="smoothness" placeholder="Mean Smoothness (e.g., 0.09)" required>
            <button type="submit">Analyze Tumor</button>
        </form>

        {% if prediction_text %}
        <div class="result-box {{ css_class }}">
            Result: {{ prediction_text }}
        </div>
        {% endif %}
    </div>
</body>
</html>
